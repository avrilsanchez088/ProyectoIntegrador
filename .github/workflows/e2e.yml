name: E2E

# Corre Playwright en su propio job — más lento y opcional, no bloquea el merge.
# Trigger manual o cuando el PR toque archivos de UI.

on:
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/api/**'
      - 'packages/**'
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.7.0'

jobs:
  e2e:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: impacto
          POSTGRES_PASSWORD: impacto_test
          POSTGRES_DB: impacto_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
    env:
      DATABASE_URL: postgres://impacto:impacto_test@localhost:5433/impacto_test
      APP_DATABASE_URL: postgres://impacto:impacto_test@localhost:5433/impacto_test
      REDIS_URL: redis://localhost:6380
      BETTER_AUTH_SECRET: test_secret_at_least_32_chars_long_xx
      BETTER_AUTH_URL: http://localhost:3100
      PUBLIC_WEB_URL: http://localhost:3100
      PUBLIC_API_URL: http://localhost:3101
      NEXT_PUBLIC_API_URL: http://localhost:3101
      APP_MODE: demo
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter @impacto/web exec playwright install --with-deps chromium
      - name: Bootstrap DB
        run: |
          PGPASSWORD=impacto_test psql -h localhost -p 5433 -U impacto -d impacto_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector; \
                CREATE EXTENSION IF NOT EXISTS pg_trgm; \
                CREATE EXTENSION IF NOT EXISTS pgcrypto; \
                CREATE EXTENSION IF NOT EXISTS btree_gist;"
          pnpm db:migrate
      - name: Run Playwright
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
